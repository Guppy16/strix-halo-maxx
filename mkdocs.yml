site_name: strix-halo-maxx
site_description: Hand-optimised model inference on AMD Strix Halo (XDNA2 NPU and gfx1151 GPU)
repo_url: https://github.com/Guppy16/strix-halo-maxx
repo_name: Guppy16/strix-halo-maxx
site_url: https://guppy16.github.io/strix-halo-maxx/
edit_uri: edit/main/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.view
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# The Markdown stays where it is (GitHub renders it too); same-dir lets the
# repo root be the docs dir.
docs_dir: .
plugins:
  - search
  - same-dir

hooks:
  - tools/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-style anchors, so the book's #fragment links work on both
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

# MathJax for $...$ / $$...$$ (pymdownx.arithmatex, generic mode)
extra_javascript:
  - tools/web/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

validation:
  omitted_files: ignore

# Keep build products and big files out of the site. Only Markdown and small
# text sources the book links to are copied.
exclude_docs: |
  .git/
  .github/
  .claude/
  CLAUDE.md
  /site/
  build/
  **/build/
  **/bak/
  __pycache__/
  *.o
  *.out
  *.log
  *.dis
  *.s
  *.npy
  *.npz
  *.pt
  *.safetensors
  *.xclbin
  *.elf
  *.nm
  *.size
  *.jsonl
  common/tools/aie2p_isa_timing.json

nav:
  - Home: README.md
  - Strix Halo:
      - Contents: common/book/README.md
      - The machine: common/book/machine.md
      - Toolchain and assembly: common/book/toolchain.md
      - Measurement: common/book/measurement.md
      - Matrix multiplies: common/book/gemm.md
      - Data movement: common/book/data-movement.md
      - Fusion and overlap: common/book/fusion.md
      - Elementwise maths: common/book/elementwise.md
      - Attention: common/book/attention.md
      - Research method: common/book/method.md
      - Negative results: common/book/negative-results.md
      - Machine reference: common/MACHINE.md
  - Projects:
      - TAPNext:
          - tapnext/README.md
          - Book contents: tapnext/book/README.md
          - Step design: tapnext/book/step-design.md
          - GEMM: tapnext/book/gemm.md
          - Attention: tapnext/book/attention.md
          - SSM: tapnext/book/ssm.md
          - Norms: tapnext/book/norms.md
          - Op boundaries: tapnext/book/boundaries.md
          - Numerics: tapnext/book/numerics.md
          - Time ledger: tapnext/book/ledger.md
          - Crop study: tapnext/book/crop-study.md
          - Lab notebook:
              - Notes: tapnext/npu/NOTES.md
              - Results: tapnext/npu/RESULTS.md
              - Handoff: tapnext/npu/HANDOFF.md
      - Moondream:
          - moondream/README.md
          - Book contents: moondream/book/README.md
          - Overview: moondream/book/overview.md
          - GPU fast path: moondream/book/gpu.md
          - NPU GEMMs: moondream/book/npu-gemm.md
          - NPU attention: moondream/book/npu-attention.md
          - NPU elementwise: moondream/book/npu-elementwise.md
          - Numerics: moondream/book/numerics.md
          - moondream3 and 0.5B: moondream/book/moondream3.md
          - Lab notebook:
              - NPU notes: moondream/npu/NOTES.md
              - NPU results: moondream/npu/RESULTS.md
